<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kristie USA</title>

  <!-- CCILU-style condensed font -->
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --ccilu-navy: #173b84;
      --ccilu-dark-navy: #0f2f70;
      --ccilu-text: rgba(255,255,255,0.92);
    }

    body {
      font-family: 'Oswald', sans-serif;
      background: var(--ccilu-navy);
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    /* Top banner */
    .top-bar {
      width: 100%;
      background: var(--ccilu-dark-navy);
      padding: 14px 24px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Main section */
    .hero {
      width: 100%;
      height: calc(100vh - 52px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background: var(--ccilu-navy);
    }

    .container {
      max-width: 900px;
    }

    h1 {
      font-size: 78px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 28px;
    }

    p {
      font-size: 26px;
      line-height: 1.6;
      font-weight: 300;
      color: var(--ccilu-text);
      letter-spacing: 0.5px;
      margin-bottom: 38px;
    }

    .powered {
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.72);
      margin-bottom: 42px;
    }

    .btn {
      display: inline-block;
      padding: 18px 42px;
      background: white;
      color: var(--ccilu-navy);
      text-decoration: none;
      text-transform: uppercase;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 2px;
      transition: 0.3s ease;
    }

    .btn:hover {
      background: #e8e8e8;
      transform: translateY(-2px);
    }

    /* Mobile */
    @media (max-width: 768px) {

      .top-bar {
        text-align: center;
        font-size: 12px;
      }

      h1 {
        font-size: 48px;
      }

      p {
        font-size: 18px;
      }

      .powered {
        font-size: 12px;
        line-height: 1.8;
      }

      .btn {
        width: 100%;
        max-width: 280px;
      }
    }
  </style>
</head>

<body>

  <div class="top-bar">
    CCILU GREEN TECHNOLOGY
  </div>

  <section class="hero">

    <div class="container">

      <h1>Kristie USA</h1>

      <p>
        Integrating Sustainable Technologies across Sports Licensing,
        Entertainment and Manufacturing across the U.S., Canada, and Mexico.
      </p>

      <div class="powered">
        Powered by CCILU Green Technology
      </div>

      <a class="btn" href="https://ccilu.com" target="_blank">
        Visit CCILU
      </a>

    </div>

  </section>

</body>
</html>
