<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kristie USA</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      color: white;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      background:
        linear-gradient(
          rgba(0, 0, 0, 0.45),
          rgba(0, 0, 0, 0.55)
        ),
        url('https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?q=80&w=2000&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 850px;
    }

    h1 {
      font-size: 68px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    p {
      font-size: 22px;
      line-height: 1.7;
      color: rgba(255,255,255,0.92);
      margin-bottom: 30px;
    }

    .powered {
      font-size: 14px;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.75);
      margin-bottom: 35px;
      text-transform: uppercase;
    }

    .btn {
      display: inline-block;
      padding: 16px 34px;
      background: white;
      color: black;
      text-decoration: none;
      font-weight: bold;
      border-radius: 4px;
      transition: 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 14px;
    }

    .btn:hover {
      background: #e5e5e5;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 44px;
      }

      p {
        font-size: 18px;
      }

      .powered {
        font-size: 12px;
        line-height: 1.6;
      }

      .btn {
        width: 100%;
        max-width: 260px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">
    <div class="container">

      <h1>Kristie USA</h1>

      <p>
        Integrating Sustainable Technologies across Sports Licensing,
        Entertainment and Manufacturing across the U.S., Canada, and Mexico.
      </p>

      <div class="powered">
        POWERED BY CCILU GREEN TECHNOLOGY
      </div>

      <a class="btn" href="https://ccilu.com" target="_blank">
        Visit CCILU
      </a>

    </div>
  </section>

</body>
</html>
</html>
